<nav class="site-nav" aria-label="Primary Navigation">
  <a class="logo" href="{{ url_for('home') }}"><i>RS</i> RIDESYNC</a>

  <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks">
    Menu
  </button>

  <div class="links" id="navLinks">
    <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a>
    <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
    <a href="{{ url_for('safety') }}" class="{% if request.endpoint == 'safety' %}active{% endif %}">Safety</a>

    {% if current_admin_id %}
      <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint and request.endpoint.startswith('admin_') %}active{% endif %}">Admin Panel</a>
      <form method="POST" action="{{ url_for('admin_logout') }}" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="nav-link-btn">Admin Logout</button>
      </form>
    {% elif current_user_id %}
      <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('seeker_find_rides') }}" class="{% if request.endpoint == 'seeker_find_rides' %}active{% endif %}">Find Rides</a>
      <a href="{{ url_for('giver_offer_ride') }}" class="{% if request.endpoint == 'giver_offer_ride' %}active{% endif %}">Offer Ride</a>
      <a href="{{ url_for('profile') }}" class="{% if request.endpoint == 'profile' %}active{% endif %}">Profile</a>
      <form method="POST" action="{{ url_for('logout') }}" style="display:inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="nav-link-btn">Log out</button>
      </form>
    {% else %}
      <a href="{{ url_for('admin_login') }}" class="{% if request.endpoint == 'admin_login' %}active{% endif %}">Admin</a>
      <a class="keep {% if request.endpoint == 'login' %}active{% endif %}" href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </div>
</nav>
