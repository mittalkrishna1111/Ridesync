{% extends 'base.html' %}
{% block title %}{{ code }} – {{ title }} | RideSync{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="glass-card" style="text-align:center;">
    <div class="page-kicker">Error {{ code }}</div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-subtitle" style="margin:12px auto 22px;">{{ message }}</p>
    <div class="login" style="margin-top:0;">
      <a href="{{ url_for('home') }}" class="btn primary">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}
